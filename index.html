/* ============ FORMULES ============ */
function Formules() {
  const [idx, setIdx] = useState(0);
  const [paused, setPaused] = useState(false);
  const total = MENUS.length;

  // Auto-advance every 5s
  useEffect(() => {
    if (paused) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const t = setInterval(() => setIdx((i) => (i + 1) % total), 5000);
    return () => clearInterval(t);
  }, [paused, total]);

  // Touch swipe
  const touchX = useRef(null);
  const onTouchStart = (e) => {touchX.current = e.touches[0].clientX;};
  const onTouchEnd = (e) => {
    if (touchX.current == null) return;
    const dx = e.changedTouches[0].clientX - touchX.current;
    if (Math.abs(dx) > 40) setIdx((i) => (i + (dx < 0 ? 1 : -1) + total) % total);
    touchX.current = null;
  };

  const prev = () => setIdx((i) => (i - 1 + total) % total);
  const next = () => setIdx((i) => (i + 1) % total);

  return (
    <section style={{ maxWidth: 1200, margin: '56px auto 0', padding: '30px 24px' }}>
      <div style={{ textAlign: 'center', marginBottom: 34 }}>
        <div className="brush" style={{ fontSize: 30, color: 'var(--red)', lineHeight: 1 }}>套 餐</div>
        <h2 className="serif" style={{ fontSize: 'clamp(40px,5vw,56px)', margin: '4px 0 0', fontWeight: 500, fontStyle: 'italic' }}>Nos menus</h2>
        <Divider sub="midi & soir · sur place ou à emporter" />
      </div>

      <div
        onMouseEnter={() => setPaused(true)}
        onMouseLeave={() => setPaused(false)}
        onTouchStart={onTouchStart}
        onTouchEnd={onTouchEnd}
        style={{ position: 'relative', maxWidth: 760, margin: '0 auto', padding: '0 56px' }}>
        
        {/* Arrows */}
        <button onClick={prev} aria-label="Menu précédent" style={arrowStyle('left')}>‹</button>
        <button onClick={next} aria-label="Menu suivant" style={arrowStyle('right')}>›</button>

        {/* Viewport */}
        <div style={{ overflow: 'hidden', borderRadius: 0 }}>
          <div style={{
            display: 'flex',
            transition: 'transform .6s cubic-bezier(.22,.61,.36,1)',
            transform: `translateX(-${idx * 100}%)`
          }}>
            {MENUS.map((f) =>
            <div key={f.id} style={{ flex: '0 0 100%', padding: '10px 14px 26px' }}>
                <FormuleCard f={f} />
              </div>
            )}
          </div>
        </div>

        {/* Dots */}
        <div style={{ display: 'flex', justifyContent: 'center', gap: 8, marginTop: 6 }}>
          {MENUS.map((m, i) =>
          <button key={m.id} onClick={() => setIdx(i)} aria-label={`Aller au menu ${i + 1}`} style={{
            width: idx === i ? 28 : 10, height: 10,
            background: idx === i ? 'var(--red)' : 'rgba(160,36,26,.25)',
            border: 0, borderRadius: 5, padding: 0,
            transition: 'all .35s ease', cursor: 'pointer'
          }} />
          )}
        </div>

        {/* Counter */}
        <div className="small" style={{ textAlign: 'center', color: 'var(--muted)', marginTop: 10 }}>
          {String(idx + 1).padStart(2, '0')} / {String(total).padStart(2, '0')}
        </div>
      </div>
    </section>);

}

function arrowStyle(side) {
  return {
    position: 'absolute', top: '50%', transform: 'translateY(-50%)',
    [side]: 0,
    width: 44, height: 44, borderRadius: '50%',
    background: 'var(--paper)', border: '1px solid rgba(160,36,26,.4)',
    color: 'var(--red)', fontSize: 30, lineHeight: 1,
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    paddingBottom: 4,
    boxShadow: '0 8px 20px -8px rgba(0,0,0,.3)',
    zIndex: 3, cursor: 'pointer',
    transition: 'background .2s, color .2s'
  };
}

function resolveChoices(line) {
  if (line.from) return MENU.filter((m) => m.cat === line.from);
  if (line.filter) return MENU.filter(line.filter);
  if (line.items) return line.items.map((s, i) => ({ id: 'item-' + i + '-' + s, name: s }));
  return null;
}

function FormuleCard({ f }) {
  const isBest = f.best;
  const accent = isBest ? 'var(--gold-soft)' : 'var(--red)';
  const ruleColor = isBest ? 'rgba(255,255,255,.18)' : 'rgba(160,36,26,.18)';
  const subtle = isBest ? 'rgba(244,234,208,.78)' : 'var(--ink-soft)';
  return (
    <article className="paper-card" style={{ position: 'relative', background: isBest ? 'var(--red)' : 'var(--paper)', color: isBest ? 'var(--paper)' : 'var(--ink)', border: isBest ? '1px solid var(--red-deep)' : '1px solid rgba(160,36,26,.3)', boxShadow: '0 2px 0 rgba(0,0,0,.05),0 18px 40px -22px rgba(60,30,20,.3)', overflow: 'hidden', backgroundImage: isBest ? 'none' : undefined }}>

        <h3 className="serif" style={{ fontSize: 32, margin: '0 0 4px', fontWeight: 500, fontStyle: 'italic' }}>{f.title}</h3>
        <div className="serif" style={{ fontSize: 'clamp(36px,3vw,48px)', fontWeight: 600, margin: '12px 0 4px', color: accent }}>
          {f.price.toFixed(2).replace('.', ',')} €
        </div>
        {f.desc && <div className="serif" style={{ fontStyle: 'italic', fontSize: 15, opacity: .85, marginBottom: 14, lineHeight: 1.4 }}>{f.desc}</div>}
        <div style={{ height: 1, background: ruleColor, margin: '14px auto', width: 60 }} />
        <ul style={{ listStyle: 'none', padding: 0, margin: 0, display: 'grid', gap: 14, fontSize: 14, lineHeight: 1.5, textAlign: 'left' }}>
          {f.lines.map((l, i) => {
            const choices = resolveChoices(l);
            return (
              <li key={i} style={{ display: 'grid', gap: 4 }}>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
                  <span style={{ color: accent, fontSize: 11, lineHeight: 1, transform: 'translateY(-1px)' }}>◆</span>
                  <span className="serif" style={{ fontSize: 17, fontStyle: 'italic', fontWeight: 600 }}>{l.label}</span>
                </div>
                {choices && choices.length > 0 &&
                <div className="serif" style={{ fontStyle: 'italic', fontSize: 13.5, color: subtle, lineHeight: 1.55, paddingLeft: 19 }}>
                    {choices.map((c, j) =>
                  <span key={c.id}>
                        {c.name}{j < choices.length - 1 && <span style={{ color: accent, opacity: .55, margin: '0 6px' }}>·</span>}
                      </span>
                  )}
                  </div>
                }
              </li>);
          })}
        </ul>
        <div className="small" style={{ opacity: .6, marginTop: 22, textAlign: 'center' }}>{f.when}</div>
      </div>
    </article>);

}

  const scrollToCat = (id) => {
    setActiveCat(id);
    const el = refs.current[id];
    if (!el) return;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: el.offsetTop - 90, behavior: reduce ? 'auto' : 'smooth' });
  };

  useEffect(() => {
    const onScroll = () => {
      const y = window.scrollY + 120;
      let cur = activeCat;
      for (const c of CATS) {
        const el = refs.current[c.id];
        if (el && el.offsetTop <= y) cur = c.id;
      }
      if (cur !== activeCat) setActiveCat(cur);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, [activeCat]);

  return (
    <section style={{ maxWidth: 1200, margin: '40px auto 0', padding: '40px 24px' }}>
      <div style={{ textAlign: 'center', marginBottom: 30 }}>
        <div className="brush" style={{ fontSize: 36, color: 'var(--red)', lineHeight: 1 }}>菜 单</div>
        <h2 className="serif" style={{ fontSize: 'clamp(48px,6vw,72px)', margin: '4px 0 0', fontWeight: 500, fontStyle: 'italic' }}>La Carte</h2>
        <Divider sub="prix par pièce ou par portion" />
      </div>

      {/* ===== Filtres régime alimentaire ===== */}
      <div style={{ display: 'flex', gap: 6, justifyContent: 'center', flexWrap: 'wrap', marginBottom: 18, paddingBottom: 18, borderBottom: '1px dashed rgba(160,36,26,.25)' }}>
        <span className="small" style={{ color: 'var(--muted)', alignSelf: 'center', marginRight: 8 }}>Filtrer :</span>
        {FILTERS.map((f) =>
        <button key={f.id} className={'filter-chip' + (filter === f.id ? ' active' : '')} aria-pressed={filter === f.id} onClick={() => setFilter(f.id)}>
            {f.zh && <span className="zh">{f.zh}</span>}
            {f.label}
          </button>
        )}
      </div>

      {/* ===== Navigation par catégorie ===== */}
      <div style={{ position: 'sticky', top: 0, zIndex: 10, background: 'var(--paper)', backgroundImage: 'linear-gradient(180deg,var(--paper) 80%,rgba(245,236,215,0))', borderBottom: '1px solid rgba(160,36,26,.25)', marginBottom: 32, padding: '10px 0' }}>
        <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', alignItems: 'center', gap: 6 }}>
          {CATS.map((c) =>
          <button key={c.id} className={'tab' + (activeCat === c.id ? ' active' : '')} aria-current={activeCat === c.id ? 'true' : undefined} onClick={() => scrollToCat(c.id)}>
              <span className="zh">{c.zh}</span>
              <span className="fr">{c.fr}</span>
            </button>
          )}
          <div style={{ position: 'relative', marginLeft: 14, alignSelf: 'center' }}>
            <input type="search" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="rechercher un plat…" aria-label="Rechercher un plat" style={{ background: 'transparent', border: '1px solid rgba(160,36,26,.3)', padding: '7px 14px 7px 30px', fontFamily: 'inherit', fontSize: 13, color: 'var(--ink)', outline: 'none', width: 200, borderRadius: 0 }} />
            <span style={{ position: 'absolute', left: 10, top: 7, color: 'var(--red)' }}>⌕</span>
          </div>
        </div>
      </div>

      {CATS.map((c) => {
        const items = grouped[c.id];
        if (!items || items.length === 0) return null;
        return (
          <div key={c.id} ref={(el) => refs.current[c.id] = el} style={{ marginBottom: 54, scrollMarginTop: 120 }}>
            <SectionHeader cat={c} />
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(360px,1fr))', gap: '22px 56px', marginTop: 24 }}>
              {items.map((m) => <DishLine key={m.id} m={m} onZoom={onZoom} />)}
            </div>
          </div>);

      })}

      {filtered.length === 0 &&
      <div style={{ textAlign: 'center', padding: '60px 20px', color: 'var(--muted)', fontStyle: 'italic', fontFamily: 'Cormorant Garamond,serif', fontSize: 18 }}>
          Aucun plat ne correspond à ce filtre.
        </div>
      }

      <FooterNote />
    </section>);

}

function SectionHeader({ cat }) {
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', gap: 18, paddingBottom: 6, borderBottom: '2px solid var(--red)' }}>
      <div style={{ flex: '0 0 auto', display: 'flex', alignItems: 'baseline', gap: 14 }}>
        <span className="brush" style={{ fontSize: 46, color: 'var(--red)', lineHeight: 1 }}>{cat.zh}</span>
        <h3 className="serif" style={{ fontSize: 34, margin: 0, fontWeight: 500, fontStyle: 'italic', color: 'var(--ink)' }}>{cat.fr}</h3>
      </div>
      <div style={{ flex: 1, paddingBottom: 8, borderBottom: '1px dashed rgba(160,36,26,.5)' }} />
      <div className="small" style={{ color: 'var(--muted)', paddingBottom: 8 }}>{cat.sub}</div>
    </div>);

}

function DishLine({ m, onZoom }) {
  const [imgErr, setImgErr] = useState(false);
  const hasImg = m.img && !imgErr;
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '92px 1fr', gap: 16, alignItems: 'flex-start', padding: '4px 0' }}>
      <button
        className="thumb"
        onClick={() => hasImg && onZoom && onZoom(m)}
        disabled={!hasImg}
        aria-label={hasImg ? `Agrandir la photo de ${m.name}` : undefined}
        style={{
          width: 92, height: 92, position: 'relative', overflow: 'hidden',
          border: '1px solid rgba(160,36,26,.3)', background: 'var(--paper-2)',
          boxShadow: '0 6px 14px -10px rgba(0,0,0,.4)',
          padding: 0, cursor: hasImg ? 'zoom-in' : 'default'
        }}>
        {hasImg ?
        <img src={m.img} alt={m.name} loading="lazy" decoding="async" onError={() => setImgErr(true)} style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} /> :

        <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'repeating-linear-gradient(45deg,rgba(160,36,26,.06) 0 2px,transparent 2px 10px)' }}>
            <span style={{ fontSize: 30, color: 'rgba(160,36,26,.28)' }}>✿</span>
          </div>
        }
        <div style={{ position: 'absolute', top: 0, left: 0, width: 0, height: 0, borderStyle: 'solid', borderWidth: '10px 10px 0 0', borderColor: 'var(--red) transparent transparent transparent', opacity: .7 }} />
        {hasImg &&
        <div style={{ position: 'absolute', bottom: 4, right: 4, width: 22, height: 22, background: 'rgba(43,26,18,.78)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, lineHeight: 1, borderRadius: '50%', pointerEvents: 'none' }} title="Cliquer pour agrandir">⚲</div>
        }
      </button>
      <div style={{ minWidth: 0 }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, flexWrap: 'wrap' }}>
          <span className="serif" style={{ fontSize: 21, fontWeight: 500, color: 'var(--ink)', letterSpacing: '.01em' }}>{m.name}</span>
          {m.signature && <span title="Spécialité maison" style={{ color: 'var(--gold)', fontSize: 13 }}>✦</span>}
          <SpiceDots level={m.hot} />
        </div>
        {m.desc &&
        <div className="serif" style={{ fontStyle: 'italic', color: 'var(--ink-soft)', lineHeight: 1.45, marginTop: 3, maxWidth: '46ch', fontSize: "15px" }}>
            {m.desc}
          </div>
        }
        <div style={{ display: 'flex', gap: 4, marginTop: 6, flexWrap: 'wrap' }}>
          {m.halal && <span className="tag-halal">حلال Halal</span>}
          {m.gf && <span className="tag-gf">Sans gluten</span>}
          {m.veg && <span className="tag-vege">Végé</span>}
        </div>
        <div style={{ marginTop: 8, display: 'flex', alignItems: 'center', gap: 0 }}>
          <div style={{ flex: 1, borderBottom: '2px dotted rgba(43,26,18,.25)', marginRight: 8 }} />
          <PriceTag price={m.price} unit={m.unit} alt={m.alt} />
        </div>
      </div>
    </div>);

}

function FooterNote() {
  return (
    <div style={{ textAlign: 'center', marginTop: 50, paddingTop: 32, borderTop: '1px dashed rgba(160,36,26,.3)' }}>
      <div style={{ display: 'inline-flex', alignItems: 'center', gap: 22, flexWrap: 'wrap', justifyContent: 'center', fontSize: 12, color: 'var(--muted)', letterSpacing: '.08em' }}>
        <span><span style={{ color: 'var(--red)' }}>◆</span> Épicé</span>
        <span><span style={{ color: 'var(--gold)' }}>✦</span> Spécialité maison</span>
        <span><span className="tag-halal" style={{ padding: '2px 5px' }}>حلال</span> Poulet halal uniquement</span>
        <span><span className="tag-gf" style={{ padding: '2px 5px' }}>SG</span> Sans gluten</span>
      </div>
      <div className="serif" style={{ fontStyle: 'italic', fontSize: 15, color: 'var(--ink-soft)', marginTop: 18, maxWidth: 680, margin: '18px auto 0', lineHeight: 1.55 }}>
        Tous nos plats sont préparés sur place, chaque jour. Seul le <strong>poulet</strong> est halal — les autres viandes ne le sont pas.
        Une allergie ? N'hésitez pas à nous le dire, nous adapterons avec plaisir.<br />
        Prix nets, service compris. Carte susceptible d'évoluer selon le marché.
      </div>
      <div style={{ marginTop: 24, display: 'flex', gap: 18, justifyContent: 'center', alignItems: 'center' }}>
        <div className="stamp">福</div>
      </div>
    </div>);

}

/* ============ ZOOM MODAL (image seulement) ============ */
function ZoomModal({ dish, onClose }) {
  useEffect(() => {
    if (!dish) return;
    const onKey = (e) => {if (e.key === 'Escape') onClose();};
    window.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => {
      window.removeEventListener('keydown', onKey);
      document.body.style.overflow = '';
    };
  }, [dish, onClose]);
  if (!dish) return null;
  return (
    <div onClick={onClose} role="dialog" aria-modal="true" aria-label={`Photo — ${dish.name}`} style={{
      position: 'fixed', inset: 0, zIndex: 200,
      background: 'rgba(20,12,6,.92)', backdropFilter: 'blur(8px)', WebkitBackdropFilter: 'blur(8px)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      padding: '4vh 4vw',
      animation: 'zfade .2s ease',
      cursor: 'zoom-out'
    }}>
      <style>{`@keyframes zfade{from{opacity:0}to{opacity:1}}@keyframes zpop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}`}</style>
      <button onClick={onClose} aria-label="Fermer" style={{
        position: 'absolute', top: 24, right: 24, width: 46, height: 46, borderRadius: '50%',
        background: 'rgba(255,255,255,.95)', color: 'var(--red)', border: '1px solid var(--red)',
        fontSize: 24, lineHeight: 1, paddingBottom: 3, zIndex: 5, cursor: 'pointer',
        boxShadow: '0 8px 20px -8px rgba(0,0,0,.5)'
      }}>×</button>
      <img
        src={dish.img}
        alt={dish.name}
        onClick={(e) => e.stopPropagation()}
        style={{
          maxWidth: '92vw',
          maxHeight: '90vh',
          objectFit: 'contain',
          display: 'block',
          boxShadow: '0 30px 80px -10px rgba(0,0,0,.7)',
          animation: 'zpop .3s cubic-bezier(.22,.61,.36,1)',
          cursor: 'default'
        }} />
      
    </div>);

}

/* ============ FAMILLE ============ */
function Family() {
  return (
    <section style={{ maxWidth: 1200, margin: '80px auto 0', padding: '60px 24px', position: 'relative' }}>
      <div style={{ display: 'grid', gridTemplateColumns: '1.1fr 1fr', gap: 46, alignItems: 'center' }}>
        <div style={{ position: 'relative' }}>
          <img src="images/r/compressed/hero.jpg" alt="Vitrine Table d'Asie" style={{ width: '100%', aspectRatio: '4/3', objectFit: 'cover', display: 'block', border: '1px solid rgba(160,36,26,.3)', boxShadow: '0 30px 60px -30px rgba(0,0,0,.45)' }} />
          <div style={{ position: 'absolute', bottom: -30, right: -30, width: 180, height: 180, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <img src="images/r/logo-badge.png" alt="Logo Table d'Asie" style={{ width: '100%', height: '100%', objectFit: 'contain', filter: 'drop-shadow(0 8px 18px rgba(0,0,0,.25))' }} />
          </div>
        </div>
        <div>
          <div className="brush" style={{ fontSize: 32, color: 'var(--red)', lineHeight: 1 }}>家 的 味 道</div>
          <h2 className="serif" style={{ fontSize: 'clamp(38px,4.5vw,52px)', margin: '4px 0 16px', fontWeight: 500, fontStyle: 'italic', color: 'var(--ink)' }}>Le goût de la maison</h2>
          <p className="serif" style={{ fontSize: 21, fontStyle: 'italic', color: 'var(--ink-soft)', lineHeight: 1.55 }}>
            Au cœur de Juan-les-Pins, une famille reçoit comme à la maison. Les nems sont roulés à la main chaque matin, les bouillons mijotent, et les woks chantent jusque tard dans la soirée.
          </p>
          <p style={{ fontSize: 15, lineHeight: 1.7, color: 'var(--ink-soft)', marginTop: 18 }}>
            Pas de chichis : on choisit ce qu'on aime à la vitrine, on emporte ou on s'installe, on partage. Une cuisine sincère, fidèle aux saveurs du Cambodge, du Vietnam, de la Chine et de la Thaïlande — servie avec le sourire depuis 2011.
          </p>
          <div style={{ marginTop: 26, display: 'flex', gap: 14, alignItems: 'center' }}>
            <div className="stamp" style={{ width: 64, height: 64, fontSize: 34 }}>味</div>
            <div className="serif" style={{ fontStyle: 'italic', fontSize: 18, color: 'var(--ink)' }}>— fait maison, chaque jour, avec amour</div>
          </div>
        </div>
      </div>
    </section>);

}

/* ============ INFOS ============ */
function Infos() {
  const hours = [
  ['Lundi', '10:30 – 22:00'],
  ['Mardi', '10:30 – 22:00'],
  ['Mercredi', '10:30 – 22:00'],
  ['Jeudi', '10:30 – 22:00'],
  ['Vendredi', '10:30 – 22:00'],
  ['Samedi', '10:30 – 22:00'],
  ['Dimanche', '10:30 – 21:00']];

  const todayIdx = (new Date().getDay() + 6) % 7; // Lundi = 0

  return (
    <section style={{ marginTop: 90, background: 'var(--red)', color: 'var(--paper)', backgroundImage: 'radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.07), transparent 62%)' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto', padding: '70px 24px' }}>
        <div style={{ textAlign: 'center', marginBottom: 46 }}>
          <div className="brush" style={{ fontSize: 32, color: 'var(--gold-soft)', lineHeight: 1 }}>联 系 我 们</div>
          <h2 className="serif" style={{ fontSize: 'clamp(40px,5vw,52px)', margin: '4px 0 0', fontWeight: 500, fontStyle: 'italic' }}>Nous trouver</h2>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(240px,1fr))', gap: 46 }}>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontSize: 30, color: 'var(--gold-soft)' }}>✿</div>
            <div className="small" style={{ color: 'var(--gold-soft)', margin: '10px 0 14px' }}>ADRESSE</div>
            <div className="serif" style={{ fontSize: 21, lineHeight: 1.45, fontStyle: 'italic' }}>
              132 Boulevard du<br />Président Wilson<br />06160 Juan-les-Pins
            </div>
            <a href="https://maps.google.com/?q=132+Boulevard+du+President+Wilson+Juan+les+Pins" target="_blank" rel="noopener" style={{ display: 'inline-block', marginTop: 16, fontSize: 11, letterSpacing: '.2em', textTransform: 'uppercase', borderBottom: '1px solid var(--gold-soft)', paddingBottom: 3, color: 'var(--gold-soft)' }}>Voir sur la carte →</a>
          </div>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontSize: 30, color: 'var(--gold-soft)' }}>☎</div>
            <div className="small" style={{ color: 'var(--gold-soft)', margin: '10px 0 14px' }}>COMMANDES</div>
            <a href="tel:+33988418678" className="serif" style={{ fontSize: 30, fontStyle: 'italic', display: 'block' }}>09 88 41 86 78</a>
            <div style={{ fontSize: 13, opacity: .85, marginTop: 10, lineHeight: 1.55 }}>Sur place · à emporter<br />Préparations à la pièce ou à la portion</div>
          </div>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontSize: 30, color: 'var(--gold-soft)' }}>◴</div>
            <div className="small" style={{ color: 'var(--gold-soft)', margin: '10px 0 14px' }}>HORAIRES</div>
            <div style={{ display: 'inline-block', textAlign: 'left' }}>
              {hours.map(([d, h], i) => {
                const today = i === todayIdx;
                return (
                  <div key={d} style={{ display: 'flex', justifyContent: 'space-between', gap: 24, padding: '4px 10px', fontSize: 13, minWidth: 300, borderRadius: 2, background: today ? 'rgba(227,176,72,.16)' : 'transparent' }}>
                  <span style={{ opacity: .95, fontWeight: today ? 700 : 400, color: today ? 'var(--gold-soft)' : 'inherit' }}>{d}{today && <span className="small" style={{ fontSize: 8.5, marginLeft: 8, opacity: .9 }}>aujourd'hui</span>}</span>
                  <span style={{ opacity: .9, fontFamily: "'Cormorant Garamond',serif", fontStyle: 'italic', fontVariantNumeric: 'tabular-nums' }}>{h}</span>
                </div>);
              })}
            </div>
            <div className="small" style={{ color: 'var(--gold-soft)', marginTop: 14, letterSpacing: '.16em' }}>Ouvert 7/7 · jours fériés inclus</div>
          </div>
        </div>
      </div>
    </section>);

}

function Footer() {
  return (
    <footer style={{ background: 'var(--ink)', color: 'rgba(245,236,215,.7)', padding: '46px 24px 28px', textAlign: 'center' }}>
      <div style={{ display: 'inline-block', background: 'var(--paper)', padding: 10, borderRadius: '50%', marginBottom: 18, boxShadow: '0 8px 24px -10px rgba(0,0,0,.6)' }}>
        <img src="images/r/logo-badge.png" alt="Table d'Asie" style={{ height: 110, width: 110, display: 'block', borderRadius: '50%' }} />
      </div>
      <div className="brush" style={{ fontSize: 22, color: 'var(--gold-soft)', marginBottom: 4, marginTop: 4 }}>谢 谢 光 临</div>
      <div className="small" style={{ letterSpacing: '.25em' }}>MERCI DE VOTRE VISITE · TABLE D'ASIE © 2026</div>
    </footer>);

}

function App() {
  const [zoomed, setZoomed] = useState(null);
  return (
    <>
      <Header />
      <Formules />
      <Sep />
      <MenuCard onZoom={setZoomed} />
      <Sep />
      <Family />
      <Infos />
      <Footer />
      <ZoomModal dish={zoomed} onClose={() => setZoomed(null)} />
    </>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
